<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behnam | Portfolio</title>
<meta http-equiv="refresh" content="1; url=./fa/">
<link rel="alternate" hreflang="fa" href="./fa/">
<link rel="alternate" hreflang="en" href="./en/">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<script>
    // انتخاب زبان: اول زبان ذخیره‌شده، بعد زبان مرورگر، در نهایت فارسی
    (function () {
        var lang = "fa";
        try {
            var saved = localStorage.getItem("lang");
            if (saved === "fa" || saved === "en") { lang = saved; }
            else {
                var pref = (navigator.languages && navigator.languages[0]) || navigator.language || "fa";
                lang = pref.toLowerCase().indexOf("fa") === 0 ? "fa" : (pref.toLowerCase().indexOf("en") === 0 ? "en" : "fa");
            }
        } catch (e) { }
        location.replace("./" + lang + "/" + location.search + location.hash);
    })();
</script>
</head>
<body>
<p><a href="./fa/">فارسی</a> · <a href="./en/">English</a></p>
</body>
</html>
